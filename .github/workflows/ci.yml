name: CI

# Build, format-check, and TEST (incl. the Aspire integration tests, which boot real Postgres +
# Redis containers — ubuntu-latest provides Docker). Plus a container image build + vulnerability
# scan + SBOM, and a Playwright E2E validation job. No cloud credentials needed here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build, format, test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (unit + Aspire integration via Docker)
        # Integration tests start Postgres/Redis containers through Aspire.Hosting.Testing.
        run: >
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --settings coverage.runsettings

      - name: Merge coverage reports
        if: always()
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage merge -f cobertura -o coverage-merged.xml **/TestResults/**/coverage.cobertura.xml

      - name: Enforce 55% coverage gate (Application + Domain packages)
        # Check coverage of the two business-logic layers measured by Application.Tests.
        # Infrastructure is excluded because it is covered by integration / E2E tests that
        # run out-of-process and do not contribute to Coverlet's instrumented measurement.
        if: always()
        run: |
          APPXML=$(find tests/NutriForge.Application.Tests/TestResults -name "coverage.cobertura.xml" | head -1)
          python3 - "$APPXML" << 'PYEOF'
          import sys, xml.etree.ElementTree as ET
          xml_path = sys.argv[1]
          tree = ET.parse(xml_path)
          checked = {"NutriForge.Application", "NutriForge.Domain"}
          failed = []
          for pkg in tree.getroot().findall(".//package"):
              name = pkg.get("name", "")
              if name in checked:
                  rate = float(pkg.get("line-rate", 0)) * 100
                  print(f"{name}: {rate:.1f}%")
                  if rate < 55:
                      failed.append(f"{name} ({rate:.1f}% < 55%)")
          if failed:
              print("Coverage gate failed:", ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5.3.11
        with:
          reports: "coverage-merged.xml"
          targetdir: coverage-report
          reporttypes: "HtmlInline;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: always()
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results + coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**/*
            coverage-report/**
          if-no-files-found: ignore

  container-scan:
    name: Container image build + scan + SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The .NET SDK builds an OCI image with no Dockerfile (Microsoft.NET.Build.Containers).
      - name: Build API container image
        run: >
          dotnet publish src/NutriForge.Api/NutriForge.Api.csproj
          --configuration Release
          /t:PublishContainer
          -p:ContainerRepository=nutriforge-api
          -p:ContainerImageTag=ci

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nutriforge-api:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Report (don't fail the build yet) until a baseline is established.
          exit-code: "0"

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: nutriforge-api:ci
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E (validate; live run env-gated)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/NutriForge.E2E
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps
        run: npm ci || npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Validates the E2E specs compile/list without a running stack.
      - name: List E2E tests
        run: npx playwright test --list

      # A full run needs the stack up; provide E2E_BASE_URL (repo variable) to enable it.
      - name: Run E2E against a deployed/preview stack
        if: ${{ vars.E2E_BASE_URL != '' }}
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: npx playwright test

  mutation:
    name: Stryker mutation score (Domain math)
    # Mutation tests are slow (~3–5 min); run on push to main and weekly but not
    # every PR to keep feedback loops tight. The break threshold (50%) is enforced.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker

      - name: Run mutation tests (Domain math)
        # stryker-config.json targets NutriForge.Domain + Domain.Tests.
        # Exit code is non-zero when mutation score < thresholds.break (50%).
        run: dotnet stryker

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: StrykerOutput/
          if-no-files-found: ignore
